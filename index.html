<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐶 狗狗日常记录</title>
    <style>
        :root {
            /* 奶油治愈系配色 */
            --bg-color: #FDFBF7;       /* 燕麦奶油背景 */
            --card-bg: #FFFFFF;        /* 纯白卡片 */
            --text-main: #2C2C2C;      /* 主文本：深灰 */
            --text-muted: #8E8E93;     /* 次要文本：浅灰 */
            
            /* 提取自参考图的马卡龙色 */
            --accent-yellow: #FFD479;  /* 温暖鹅黄 (高亮色) */
            --tag-bg: #F4F3EF;         /* 未选中标签的浅灰底色 */
            
            /* 分类柔和背景色 */
            --color-pink: #FFE8E8;     
            --color-blue: #E8F4FF;     
            --color-green: #EAF6E3;    
            --color-yellow: #FFF4D4;   
            --color-purple: #F3E8FF;   
            --color-gray: #F2F2F7;     
            
            /* 圆角与阴影 */
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-pill: 100px;
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 顶部 Header：模仿参考图 */
        .header {
            padding: 24px 24px 10px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: #EFEFEF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .greeting-text {
            display: flex;
            flex-direction: column;
        }

        .greeting {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .pet-name-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            outline: none;
            width: 150px;
        }

        .bell-icon {
            color: var(--text-muted);
            font-size: 20px;
        }

        .slogan {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        /* 胶囊状筛选标签 */
        .filter-section {
            padding: 0 24px 16px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-section::-webkit-scrollbar { display: none; }

        .filter-tag {
            padding: 8px 16px;
            background: var(--tag-bg);
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tag.active {
            background: var(--accent-yellow);
            color: var(--text-main);
            font-weight: 600;
        }

        /* 列表容器 */
        .container {
            padding: 10px 24px;
        }

        .month-header {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .month-count {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* 极简圆润卡片 */
        .record-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-soft);
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .record-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .bg-sick { background-color: var(--color-pink); }
        .bg-bath { background-color: var(--color-blue); }
        .bg-deworm { background-color: var(--color-green); }
        .bg-play { background-color: var(--color-yellow); }
        .bg-food { background-color: var(--color-purple); }
        .bg-other { background-color: var(--color-gray); }

        .record-content {
            flex: 1;
        }

        .record-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .record-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
        }

        .record-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .record-detail {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .record-actions {
            margin-top: 12px;
            display: flex;
            gap: 16px;
            justify-content: flex-end;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
        }
        
        .action-btn:hover { color: var(--text-main); }

        /* 悬浮添加按钮：居中圆润 */
        .fab-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 99;
        }

        .fab {
            width: 64px;
            height: 64px;
            background: var(--text-main);
            color: #FFF;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s;
        }

        .fab:active {
            transform: scale(0.92);
        }

        /* 柔和底部弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--bg-color);
            width: 100%;
            max-width: 600px;
            border-radius: 32px 32px 0 0;
            padding: 30px 24px 40px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: var(--tag-bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .category-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-lg);
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .category-item.selected {
            border-color: var(--accent-yellow);
            background: #FFFAF0;
            color: var(--text-main);
        }

        .category-item span:first-child { font-size: 24px; }

        .form-input, .form-textarea {
            width: 100%;
            padding: 16px;
            background: var(--card-bg);
            color: var(--text-main);
            border: none;
            border-radius: var(--radius-lg);
            font-size: 15px;
            outline: none;
        }
        
        .form-input::placeholder, .form-textarea::placeholder {
            color: #C7C7CC;
        }

        .form-textarea { height: 100px; resize: none; }

        .btn-submit {
            width: 100%;
            background: var(--text-main);
            color: #FFF;
            padding: 16px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .data-tools {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #C7C7CC;
        }

        .data-tools span { cursor: pointer; margin: 0 10px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 40px; margin-bottom: 16px; }

    </style>
</head>
<body>

    <!-- 模仿参考图的头部 -->
    <div class="header">
        <div class="header-top">
            <div class="user-profile">
                <div class="avatar">🐶</div>
                <div class="greeting-text">
                    <span class="greeting" id="greetingMsg">Good morning</span>
                    <input type="text" id="petName" class="pet-name-input" value="Emma 🌟" onblur="savePetName()">
                </div>
            </div>
            <div class="bell-icon">🔔</div>
        </div>
        <div class="slogan">记录狗狗的<br>每一天</div>
    </div>

    <!-- 胶囊筛选栏 -->
    <div class="filter-section" id="filterSection">
        <div class="filter-tag active" data-type="all">全部</div>
        <div class="filter-tag" data-type="生病">生病</div>
        <div class="filter-tag" data-type="洗澡">洗澡</div>
        <div class="filter-tag" data-type="驱虫">驱虫</div>
        <div class="filter-tag" data-type="出去玩">出去玩</div>
        <div class="filter-tag" data-type="饮食">饮食</div>
        <div class="filter-tag" data-type="其它">其它</div>
    </div>

    <!-- 列表展示区 -->
    <div class="container" id="recordsContainer"></div>

    <!-- 悬浮添加按钮 (居中) -->
    <div class="fab-container">
        <button class="fab" onclick="openModal()">+</button>
    </div>

    <!-- 底部弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">新增记录</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="recordForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="recordId">
                
                <div class="form-group">
                    <label class="form-label">类别</label>
                    <div class="category-grid" id="categoryGrid">
                        <div class="category-item selected" data-type="生病" data-bg="bg-sick">
                            <span>🏥</span><span>生病</span>
                        </div>
                        <div class="category-item" data-type="洗澡" data-bg="bg-bath">
                            <span>🛁</span><span>洗澡</span>
                        </div>
                        <div class="category-item" data-type="驱虫" data-bg="bg-deworm">
                            <span>💊</span><span>驱虫</span>
                        </div>
                        <div class="category-item" data-type="出去玩" data-bg="bg-play">
                            <span>🎾</span><span>出去玩</span>
                        </div>
                        <div class="category-item" data-type="饮食" data-bg="bg-food">
                            <span>🍖</span><span>饮食</span>
                        </div>
                        <div class="category-item" data-type="其它" data-bg="bg-other">
                            <span>📝</span><span>其它</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">时间</label>
                    <input type="datetime-local" id="recordTime" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">详情</label>
                    <textarea id="recordDetail" class="form-textarea" placeholder="写下今天发生的事情..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">保存</button>
            </form>
        </div>
    </div>

    <!-- 数据备份 -->
    <div class="data-tools">
        <span onclick="exportData()">导出数据</span> | 
        <span onclick="importData()">恢复数据</span>
        <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="handleFileImport(event)">
    </div>

    <script>
        const CATEGORIES = {
            '生病': { icon: '🏥', bg: 'bg-sick' },
            '洗澡': { icon: '🛁', bg: 'bg-bath' },
            '驱虫': { icon: '💊', bg: 'bg-deworm' },
            '出去玩': { icon: '🎾', bg: 'bg-play' },
            '饮食': { icon: '🍖', bg: 'bg-food' },
            '其它': { icon: '📝', bg: 'bg-other' }
        };

        let records = [];
        let currentFilter = 'all';
        let selectedCategory = '生病';

        window.onload = function() {
            setGreeting();
            loadPetName();
            loadRecords();
            initCategoryPicker();
            initFilter();
            render();
        };

        // 根据时间设置问候语
        function setGreeting() {
            const hour = new Date().getHours();
            let msg = 'Good evening';
            if (hour < 12) msg = 'Good morning';
            else if (hour < 18) msg = 'Good afternoon';
            document.getElementById('greetingMsg').innerText = msg;
        }

        function loadPetName() {
            const savedName = localStorage.getItem('dog_pet_name_v3');
            if (savedName) document.getElementById('petName').value = savedName;
        }

        function savePetName() {
            const name = document.getElementById('petName').value.trim();
            if (name) localStorage.setItem('dog_pet_name_v3', name);
        }

        function loadRecords() {
            const data = localStorage.getItem('dog_daily_records');
            if (data) {
                records = JSON.parse(data);
            } else {
                const now = new Date();
                records = [
                    { id: '1', type: '出去玩', time: new Date(now.getTime() - 86400000 * 1).toISOString().slice(0, 16), detail: '去了家附近的草地跑酷，认识了一只小金毛。' },
                    { id: '2', type: '洗澡', time: new Date(now.getTime() - 86400000 * 5).toISOString().slice(0, 16), detail: '在家自己洗的，吹毛吹了半个小时，很乖。' }
                ];
                saveRecords();
            }
        }

        function saveRecords() {
            localStorage.setItem('dog_daily_records', JSON.stringify(records));
        }

        function render() {
            const container = document.getElementById('recordsContainer');
            container.innerHTML = '';
            let filtered = currentFilter !== 'all' ? records.filter(r => r.type === currentFilter) : records;
            filtered.sort((a, b) => new Date(b.time) - new Date(a.time));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">🍃</div><p>还没有相关的记录哦</p></div>`;
                return;
            }

            const groups = {};
            filtered.forEach(item => {
                const d = new Date(item.time);
                const k = `${d.getFullYear()}年 ${String(d.getMonth() + 1)}月`;
                if (!groups[k]) groups[k] = [];
                groups[k].push(item);
            });

            for (const k in groups) {
                const g = document.createElement('div');
                g.innerHTML = `<div class="month-header"><span>${k}</span><span class="month-count">${groups[k].length} 项记录</span></div>`;
                
                groups[k].forEach(item => {
                    const cat = CATEGORIES[item.type] || CATEGORIES['其它'];
                    const card = document.createElement('div');
                    card.className = 'record-card';
                    card.innerHTML = `
                        <div class="record-icon ${cat.bg}">${cat.icon}</div>
                        <div class="record-content">
                            <div class="record-top">
                                <div class="record-title">${item.type}</div>
                                <div class="record-time">${formatTimeDisplay(item.time)}</div>
                            </div>
                            <div class="record-detail">${escapeHtml(item.detail)}</div>
                            <div class="record-actions">
                                <button class="action-btn" onclick="editRecord('${item.id}')">编辑</button>
                                <button class="action-btn" onclick="deleteRecord('${item.id}')" style="color:#FF5C5C">删除</button>
                            </div>
                        </div>
                    `;
                    g.appendChild(card);
                });
                container.appendChild(g);
            }
        }

        function formatTimeDisplay(timeStr) {
            const d = new Date(timeStr);
            return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        function initCategoryPicker() {
            const items = document.querySelectorAll('.category-item');
            items.forEach(item => {
                item.addEventListener('click', function() {
                    items.forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedCategory = this.getAttribute('data-type');
                });
            });
        }

        function initFilter() {
            const tags = document.querySelectorAll('.filter-tag');
            tags.forEach(tag => {
                tag.addEventListener('click', function() {
                    tags.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-type');
                    render();
                });
            });
        }

        function openModal(editId = null) {
            const modal = document.getElementById('modalOverlay');
            if (editId) {
                const item = records.find(r => r.id === editId);
                if (item) {
                    document.getElementById('modalTitle').innerText = '修改记录';
                    document.getElementById('recordId').value = item.id;
                    document.getElementById('recordTime').value = item.time;
                    document.getElementById('recordDetail').value = item.detail;
                    selectedCategory = item.type;
                    document.querySelectorAll('.category-item').forEach(i => {
                        i.classList.toggle('selected', i.getAttribute('data-type') === item.type);
                    });
                }
            } else {
                document.getElementById('modalTitle').innerText = '新增记录';
                document.getElementById('recordForm').reset();
                document.getElementById('recordId').value = '';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('recordTime').value = now.toISOString().slice(0, 16);
            }
            modal.classList.add('active');
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('recordId').value;
            const time = document.getElementById('recordTime').value;
            const detail = document.getElementById('recordDetail').value.trim();
            if (id) {
                const index = records.findIndex(r => r.id === id);
                if (index !== -1) records[index] = { id, type: selectedCategory, time, detail };
            } else {
                records.push({ id: Date.now().toString(), type: selectedCategory, time, detail });
            }
            saveRecords();
            render();
            closeModal();
        }

        function editRecord(id) { openModal(id); }
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                records = records.filter(r => r.id !== id);
                saveRecords();
                render();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `狗狗记录_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
        function importData() { document.getElementById('importFileInput').click(); }
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        saveRecords();
                        render();
                        alert('数据导入成功！');
                    } else alert('数据格式不正确哦');
                } catch (err) { alert('读取失败，请确认文件正确'); }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
