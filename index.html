<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记录狗狗的每一天</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2C;
            --text-muted: #8E8E93;
            --accent-yellow: #FFD479;
            --tag-bg: #F4F3EF;
            
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-pill: 100px;
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 100px; max-width: 600px; margin: 0 auto; min-height: 100vh; }

        #syncStatus { position: absolute; right: 24px; top: 24px; font-size: 12px; color: var(--text-muted); font-weight: 500; transition: opacity 0.3s; opacity: 0; }
        .header { padding: 40px 24px 16px; position: relative; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .user-profile { display: flex; align-items: center; gap: 16px; width: 100%; }
        
        .avatar-container { position: relative; cursor: pointer; flex-shrink: 0; }
        .avatar { width: 72px; height: 72px; background: #EFEFEF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; object-fit: cover; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-hint { position: absolute; bottom: -2px; right: -2px; background: var(--text-main); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-color); }

        .greeting-text { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .greeting { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .name-wrapper { display: flex; align-items: center; }
        .pet-name-input { background: transparent; border: none; color: var(--text-main); font-size: 22px; font-weight: 700; outline: none; width: 140px; border-bottom: 1px dashed transparent; transition: border-color 0.2s; }
        .pet-name-input:focus, .pet-name-input:hover { border-bottom-color: var(--text-muted); }

        .body-stats-wrapper { display: flex; gap: 6px; font-size: 11px; color: var(--text-muted); margin-top: 4px; cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.2s; padding-bottom: 2px; width: 100%; white-space: nowrap; flex-wrap: nowrap; overflow: hidden; align-items: center; }
        .body-stats-wrapper:hover { border-bottom-color: var(--text-muted); }
        .body-stats-wrapper span { display: inline-block; white-space: nowrap; }
        .body-stats-wrapper b { color: var(--text-main); font-weight: 600; }

        .slogan-input { width: 100%; background: transparent; border: none; font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px dashed transparent; transition: border-color 0.2s; }
        .slogan-input:focus, .slogan-input:hover { border-bottom-color: var(--text-muted); }

        .filter-section { padding: 0 24px 16px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .filter-section::-webkit-scrollbar { display: none; }
        .filter-tag { padding: 8px 16px; background: var(--tag-bg); border-radius: var(--radius-pill); font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--text-muted); cursor: pointer; transition: all 0.2s; border: none; display: flex; align-items: center; justify-content: center; }
        
        .list-header-bar { padding: 10px 24px 0; display: flex; align-items: center; justify-content: space-between; }
        .list-header-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
        
        .date-filter-wrapper { position: relative; display: flex; align-items: center; background: var(--tag-bg); border-radius: 12px; padding: 6px 12px; overflow: hidden; }
        .date-filter-icon { font-size: 18px; pointer-events: none; }
        .date-filter-input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 1; }
        .date-clear-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; display: none; padding-left: 8px; border-left: 1px solid #D1D1D6; margin-left: 8px; position: relative; z-index: 2; font-weight: bold; }

        .container { padding: 4px 24px 10px; }
        .month-group { margin-bottom: 20px; }
        .month-header { font-size: 15px; font-weight: 600; color: var(--text-muted); margin: 16px 0 12px; display: flex; align-items: center; justify-content: space-between; }
        .month-count { font-size: 12px; font-weight: normal; }

        .record-card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow-soft); display: flex; gap: 16px; align-items: flex-start; transition: transform 0.2s, background-color 0.5s; position: relative; }
        .sortable-ghost { opacity: 0.4; }
        .sortable-drag { transform: scale(1.02); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1); z-index: 10; }
        
        .record-icon { width: 48px; height: 48px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .record-content { flex: 1; min-width: 0; }
        .record-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .record-title { font-weight: 600; font-size: 16px; color: var(--text-main); }
        .record-time { font-size: 13px; color: var(--text-muted); font-weight: 500;}
        .record-detail { font-size: 14px; color: var(--text-muted); line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
        .record-actions { margin-top: 10px; display: flex; gap: 16px; justify-content: flex-end; }
        .action-btn { background: none; border: none; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; }
        
        .drag-handle { display: none; position: absolute; right: 16px; top: 16px; color: #C7C7CC; cursor: grab; font-size: 16px; }
        .record-card:hover .drag-handle { display: block; }

        .fab-container { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 99; }
        .fab { width: 60px; height: 60px; background: var(--text-main); color: #FFF; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); cursor: pointer; pointer-events: auto; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--bg-color); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 24px 24px 40px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: var(--tag-bg); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--text-muted); cursor: pointer; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 10px; }
        .form-input, .form-textarea { width: 100%; padding: 14px; background: var(--card-bg); color: var(--text-main); border: none; border-radius: 12px; font-size: 15px; outline: none; }
        .form-input::placeholder, .form-textarea::placeholder { color: #C7C7CC; }
        .form-textarea { height: 90px; resize: none; }
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: var(--radius-pill); font-size: 16px; font-weight: 600; transition: background 0.3s; }

        @keyframes flashHighlight { 0% { background-color: #FFD479; } 100% { background-color: var(--card-bg); } }
        .highlight-stat, .highlight-record { animation: flashHighlight 2s ease-out; }

        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .category-item { background: var(--card-bg); padding: 12px; border-radius: var(--radius-lg); text-align: center; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 2px solid transparent; }
        .category-item.selected { border-color: var(--accent-yellow); color: var(--text-main); }
        .category-item span:first-child { font-size: 24px; }

        .tag-manage-list { display: flex; flex-direction: column; gap: 10px; }
        .tag-manage-item { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 12px 16px; border-radius: 12px; }
        .tag-manage-info { display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .tag-manage-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;}
        .tag-manage-actions { display: flex; gap: 8px; }
        .icon-btn { background: var(--tag-bg); border: none; width: 30px; height: 30px; border-radius: 8px; color: var(--text-main); cursor: pointer; }

        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
        .color-swatch { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .color-swatch.selected { border-color: var(--text-main); transform: scale(1.1); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .data-tools { text-align: center; margin-top: 30px; font-size: 13px; color: #C7C7CC; font-weight: 500;}
        .data-tools span:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="header">
        <div id="syncStatus"></div>
        <div class="header-top">
            <div class="user-profile">
                <label class="avatar-container" title="点击修改头像">
                    <div class="avatar" id="avatarPreview">🐶</div>
                    <div class="avatar-hint">📷</div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
                </label>
                <div class="greeting-text">
                    <span class="greeting" id="greetingMsg">Good morning</span>
                    <div class="name-wrapper">
                        <input type="text" id="petName" class="pet-name-input" value="Emma" onblur="saveSettings()" placeholder="输入名字" title="点击修改名字">
                    </div>
                    <div class="body-stats-wrapper" onclick="openStatsModal()" title="点击修改身体数据">
                        <span>体重: <b id="displayWeight">--</b> kg</span>
                        <span>胸围: <b id="displayChest">--</b> cm</span>
                        <span>颈围: <b id="displayNeck">--</b> cm</span>
                        <span>身长: <b id="displayLength">--</b> cm</span>
                    </div>
                </div>
            </div>
        </div>
        <input type="text" id="slogan" class="slogan-input" value="记录狗狗的每一天" maxlength="15" onblur="saveSettings()" placeholder="一句话记录" title="点击修改标语">
    </div>

    <div class="filter-section" id="filterTagsContainer"></div>

    <div class="list-header-bar" id="listHeaderBar">
        <div class="list-header-title" id="listTitle">所有记录</div>
        <div class="date-filter-wrapper" id="dateFilterWrapper" title="筛选月份">
            <span class="date-filter-icon">📅</span>
            <input type="month" id="dateFilter" class="date-filter-input" onchange="renderRecords()">
            <button class="date-clear-btn" id="clearDateBtn" onclick="clearDateFilter()" title="清除日期">✕</button>
        </div>
    </div>

    <div class="container" id="recordsContainer"></div>

    <div class="fab-container">
        <button class="fab" onclick="openRecordModal()">+</button>
    </div>

    <!-- 记录添加/编辑弹窗 -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="recordModalTitle">新增记录</div>
                <button class="modal-close" onclick="closeModal('recordModal')" type="button">✕</button>
            </div>
            <form id="recordForm" onsubmit="handleRecordSubmit(event)">
                <input type="hidden" id="recordId">
                <div class="form-group">
                    <label class="form-label">类别</label>
                    <div class="category-grid" id="recordCategoryGrid"></div>
                </div>
                <div class="form-group">
                    <div class="form-label" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                        <span>日期</span>
                        <label id="singleDayToggle" style="display:none; font-size:13px; font-weight:normal; color:var(--text-main); cursor:pointer; align-items:center; gap:4px;">
                            <input type="checkbox" id="isSingleDay" checked onchange="toggleEndDate()" style="margin:0;"> 仅一天
                        </label>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="date" id="recordTime" class="form-input" required style="flex:1;">
                        <span id="endDateSeparator" style="display:none; color:var(--text-muted);">至</span>
                        <input type="date" id="recordEndTime" class="form-input" style="display:none; flex:1;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">详情</label>
                    <textarea id="recordDetail" class="form-textarea" placeholder="写下今天发生的事情..."></textarea>
                </div>
                <button type="submit" class="btn-submit" style="background:var(--text-main); color:#FFF; cursor:pointer;">保存记录</button>
            </form>
        </div>
    </div>

    <!-- 身体数据管理弹窗 -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">身体数据记录</div>
                <button class="modal-close" onclick="closeModal('statsModal')" type="button">✕</button>
            </div>
            <form id="statsForm" onsubmit="handleStatsSubmit(event)">
                <input type="hidden" id="statId">
                <div class="category-grid" style="grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">体重(kg)</label>
                        <input type="number" step="0.1" id="statInputWeight" class="form-input" oninput="checkStatsInputs()">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">胸围(cm)</label>
                        <input type="number" step="0.1" id="statInputChest" class="form-input" oninput="checkStatsInputs()">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">颈围(cm)</label>
                        <input type="number" step="0.1" id="statInputNeck" class="form-input" oninput="checkStatsInputs()">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">身长(cm)</label>
                        <input type="number" step="0.1" id="statInputLength" class="form-input" oninput="checkStatsInputs()">
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label class="form-label">测量日期</label>
                    <input type="date" id="statInputDate" class="form-input" required>
                </div>
                <button type="submit" class="btn-submit" id="statsSubmitBtn">保存数据</button>
            </form>
            
            <div style="margin-top: 32px;">
                <div class="form-label" style="font-weight: 600; color: var(--text-main);">历史数据记录</div>
                <div class="tag-manage-list" id="statsHistoryList"></div>
            </div>
        </div>
    </div>

    <!-- 标签管理弹窗 -->
    <div class="modal-overlay" id="tagManagerModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">管理分类标签</div>
                <button class="modal-close" onclick="closeModal('tagManagerModal'); renderApp();" type="button">✕</button>
            </div>
            <div class="tag-manage-list" id="tagManageList"></div>
            <button class="btn-submit" style="margin-top:20px; background:var(--tag-bg); color:var(--text-main); cursor:pointer;" onclick="openTagEditModal()" type="button">+ 添加新分类</button>
        </div>
    </div>

    <!-- 单个标签编辑弹窗 -->
    <div class="modal-overlay" id="tagEditModal" style="z-index: 1100;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="tagEditTitle">添加分类</div>
                <button class="modal-close" onclick="closeModal('tagEditModal')" type="button">✕</button>
            </div>
            <form id="tagForm" onsubmit="handleTagSubmit(event)">
                <input type="hidden" id="tagEditId">
                <div class="form-group">
                    <label class="form-label">名称 (如: 洗澡)</label>
                    <input type="text" id="tagName" class="form-input" required maxlength="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Emoji 图标</label>
                    <input type="text" id="tagEmoji" class="form-input" required maxlength="2" placeholder="🐶">
                </div>
                <div class="form-group">
                    <label class="form-label">背景颜色</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-swatch" style="background:#FFE8E8" data-color="#FFE8E8"></div>
                        <div class="color-swatch" style="background:#E8F4FF" data-color="#E8F4FF"></div>
                        <div class="color-swatch" style="background:#E0F7FA" data-color="#E0F7FA"></div>
                        <div class="color-swatch" style="background:#EAF6E3" data-color="#EAF6E3"></div>
                        <div class="color-swatch" style="background:#FFF4D4" data-color="#FFF4D4"></div>
                        <div class="color-swatch" style="background:#F3E8FF" data-color="#F3E8FF"></div>
                        <div class="color-swatch" style="background:#F2F2F7" data-color="#F2F2F7"></div>
                        <div class="color-swatch" style="background:#FFE0B2" data-color="#FFE0B2"></div>
                    </div>
                </div>
                <button type="submit" class="btn-submit" style="background:var(--text-main); color:#FFF; cursor:pointer;">保存标签</button>
            </form>
        </div>
    </div>

    <!-- 云同步管理弹窗 -->
    <div class="modal-overlay" id="syncModal" style="z-index: 1500;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">☁️ 家庭云同步配置</div>
                <button class="modal-close" onclick="closeModal('syncModal')" type="button">✕</button>
            </div>
            <div id="syncNotConnected">
                <div style="font-size:13px; color:var(--text-muted); margin-bottom: 20px; line-height: 1.5;">
                    <b>方式一：加入已有家庭同步</b><br>
                    如果家人已经创建好了，直接输入他分享给你的 6 位暗号即可。
                </div>
                <div class="form-group" style="display:flex; gap:10px;">
                    <input type="number" id="syncCodeInput" class="form-input" placeholder="输入 6 位数字暗号" style="flex:1">
                    <button class="btn-submit" style="width:auto; padding: 14px 20px; background:var(--text-main); color:#fff; cursor:pointer;" onclick="joinSync()">加入</button>
                </div>
                <hr style="border:none; border-top:1px dashed #E5E5EA; margin: 24px 0;">
                <div style="font-size:13px; color:var(--text-muted); margin-bottom: 20px; line-height: 1.5;">
                    <b>方式二：开启全新云同步</b><br>
                    点击下方按钮，系统将自动把您本地的数据同步至云端，并生成家庭共享暗号。
                </div>
                <button class="btn-submit" style="background:var(--accent-yellow); color:var(--text-main); cursor:pointer;" onclick="createSync()">✨ 一键生成家庭共享暗号</button>
            </div>

            <div id="syncConnected" style="display: none;">
                <div style="text-align:center; margin-bottom:24px;">
                    <div style="font-size:40px; margin-bottom:10px;">✅</div>
                    <div style="font-size:16px; font-weight:600;">已连接至家庭云端</div>
                    <div style="font-size:13px; color:var(--text-muted); margin-top:6px;">日记数据将在你每次改动时自动实时同步</div>
                </div>
                <div class="form-group">
                    <label class="form-label" style="text-align:center;">你们的家庭共享暗号 (点击复制发给家人)</label>
                    <input type="text" id="mySyncCode" class="form-input" readonly onclick="this.select(); document.execCommand('copy'); alert('共享暗号已复制！');" style="text-align:center; font-size:24px; font-weight:700; font-family:monospace; background: var(--tag-bg); color:var(--text-main); cursor:pointer; letter-spacing:2px;">
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn-submit" style="flex:1; background:var(--text-main); color:#FFF; cursor:pointer;" onclick="forcePullSync()">手动刷最新数据</button>
                    <button class="btn-submit" style="flex:1; background:#FFE8E8; color:#FF5C5C; cursor:pointer;" onclick="disconnectSync()">断开云同步</button>
                </div>
            </div>
        </div>
    </div>

    <div class="data-tools">
        <span onclick="openSyncModal()" style="cursor:pointer; color:var(--text-main); font-weight: 600;">☁️ 家庭云同步</span> | 
        <span onclick="exportData()" style="cursor:pointer">导出备份</span> | 
        <span onclick="document.getElementById('importFileInput').click()" style="cursor:pointer">恢复备份</span>
        <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="handleFileImport(event)">
    </div>

    <script>
        const DEFAULT_CATEGORIES = [
            { id: 'c1', name: '饮食', emoji: '🍖', color: '#F3E8FF' },
            { id: 'c2', name: '出去玩', emoji: '🎾', color: '#FFF4D4' },
            { id: 'c3', name: '驱虫', emoji: '💊', color: '#EAF6E3' },
            { id: 'c4', name: '洗澡', emoji: '🛁', color: '#E8F4FF' },
            { id: 'c5', name: '医院', emoji: '🏥', color: '#FFE8E8' },
            { id: 'c6', name: '疫苗', emoji: '💉', color: '#E0F7FA' }

                });

        function saveRecords(triggerCloud = true) { localStorage.setItem('dog_records', JSON.stringify(records)); if(triggerCloud) debounceSyncToCloud(); }

        // --- 核心 Cloudflare Pages Functions 云同步逻辑 ---
        function updateSyncStatus(msg) {
            const el = document.getElementById('syncStatus');
            el.innerText = msg;
            el.style.opacity = '1';
        }
        function hideSyncStatus() {
            setTimeout(() => { document.getElementById('syncStatus').style.opacity = '0'; }, 2000);
        }

        function debounceSyncToCloud() {
            if (!syncCode) return;
            clearTimeout(syncTimer);
            updateSyncStatus('正在同步至云端... ☁️');
            syncTimer = setTimeout(async () => {
                await pushToCloud();
            }, 1200);
        }

        async function pushToCloud() {
            if (!syncCode) return;
            try {
                const dataToSync = {
                    name: localStorage.getItem('dog_name') || 'Emma',
                    slogan: localStorage.getItem('dog_slogan') || '记录狗狗的每一天',
                    avatar: localStorage.getItem('dog_avatar') || '',
                    categories: categories,
                    records: records,
                    bodyStats: bodyStats
                };
                
                const response = await fetch(`/api/sync?code=${syncCode}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSync)
                });
                
                if (response.ok) {
                    updateSyncStatus('云端同步更新 ☁️');
                    hideSyncStatus();
                } else {
                    updateSyncStatus('同步失败，请检查网络 ⚠️');
                }
            } catch (err) {
                updateSyncStatus('同步失败 ⚠️');
            }
        }

        async function syncFromCloud() {
            if (!syncCode) return;
            updateSyncStatus('正在从云端拉取... ☁️');
            try {
                const response = await fetch(`/api/sync?code=${syncCode}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data) {
                        if (data.name) { document.getElementById('petName').value = data.name; localStorage.setItem('dog_name', data.name); }
                        if (data.slogan) { document.getElementById('slogan').value = data.slogan; localStorage.setItem('dog_slogan', data.slogan); document.title = data.slogan;}
                        if (data.avatar) { document.getElementById('avatarPreview').innerHTML = `<img src="${data.avatar}" alt="avatar">`; localStorage.setItem('dog_avatar', data.avatar); }
                        
                        categories = data.categories || DEFAULT_CATEGORIES;
                        records = data.records || [];
                        bodyStats = data.bodyStats || [];
                        
                        saveCategories(false);
                        saveRecords(false);
                        saveBodyStats(false);
                        
                        renderApp();
                        renderLatestBodyStats();
                        updateSyncStatus('已同步最新 ☁️');
                        hideSyncStatus();
                    }
                } else {
                    updateSyncStatus('拉取数据失败 ⚠️');
                }
            } catch (err) {
                updateSyncStatus('拉取数据失败 ⚠️');
            }
        }

        function openSyncModal() {

                document.getElementById('syncConnected').style.display = 'block';

                document.getElementById('syncConnected').style.display = 'none';
            }
        }

        async function createSync() {
            const btn = event.target;
            btn.innerText = '生成中...';
            btn.disabled = true;

            const dataToSync = {
                name: localStorage.getItem('dog_name') || 'Emma',
                slogan: localStorage.getItem('dog_slogan') || '记录狗狗的每一天',
                avatar: localStorage.getItem('dog_avatar') || '',
                categories: categories,
                records: records,
                bodyStats: bodyStats
            };

            try {
                const response = await fetch(`/api/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSync)
                });
                
                if (response.ok) {
                    const res = await response.json();
                    syncCode = res.shareCode;
                    localStorage.setItem('dog_sync_code', syncCode);
                    alert(`🎉 家庭云同步开启成功！\n\n你们的专属暗号是：${syncCode}`);
                    openSyncModal();
                } else {
                    alert('生成共享码失败，请确保 Cloudflare 后台已绑定 KV 数据库 DOG_DIARY_KV');
                }
            } catch (e) {
                alert('网络连接错误，请重试。');
            }
            btn.innerText = '✨ 一键生成家庭共享暗号';
            btn.disabled = false;
        }

        // --- 简单中心居中裁剪成正方形头像 ---
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const size = Math.min(img.width, img.height);
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const startX = (img.width - size) / 2;
                        const startY = (img.height - size) / 2;
                        ctx.drawImage(img, startX, startY, size, size, 0, 0, size, size);
                        const base64Img = canvas.toDataURL('image/png');
                        document.getElementById('avatarPreview').innerHTML = `<img src="${base64Img}" alt="avatar">`;
                        localStorage.setItem('dog_avatar', base64Img);
                        debounceSyncToCloud();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function handleStatsSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('statId').value;
            const weight = document.getElementById('statInputWeight').value;
            const chest = document.getElementById('statInputChest').value;
            const neck = document.getElementById('statInputNeck').value;
            const length = document.getElementById('statInputLength').value;
            const date = document.getElementById('statInputDate').value;
            
            if (!weight && !chest && !neck && !length) return;
            
            const existing = bodyStats.find(s => s.date === date && s.id !== id);
            if (existing) {
                const dateParts = date.split('-');
                alert(`${dateParts[0]}年${dateParts[1]}月${dateParts[2]}日的数据已经填写过啦`);
                return;
            }
            
            let targetId = id;
            if (id) {
                const index = bodyStats.findIndex(s => s.id === id);
                if (index !== -1) bodyStats[index] = { id, weight, chest, neck, length, date };
            } else {
                targetId = 'stat_' + Date.now();
                bodyStats.push({ id: targetId, weight, chest, neck, length, date });
            }
            
            saveBodyStats();
            renderLatestBodyStats();
            
            document.getElementById('statsForm').reset();
            document.getElementById('statId').value = '';
            document.getElementById('statInputDate').value = getTodayString();
            setStatsPlaceholders();
            checkStatsInputs();
            
            highlightedStatId = targetId;
            renderStatsHistoryList();
            setTimeout(() => { highlightedStatId = null; }, 2000);

        function renderFilterTags() {

        function clearDateFilter() {
            document.getElementById('dateFilter').value = '';

        }

        function renderRecords() {
            const container = document.getElementById('recordsContainer');
            const dateFilter = document.getElementById('dateFilter').value; 
            const clearBtn = document.getElementById('clearDateBtn');
            const listTitle = document.getElementById('listTitle');
            
            let filtered = records;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(r => r.categoryId === currentFilter);
            }
            
            if (dateFilter) {
                clearBtn.style.display = 'block';
                const parts = dateFilter.split('-');
                listTitle.innerText = `${parts[0]}年${parseInt(parts[1])}月`;
                filtered = filtered.filter(r => { return r.time.substring(0, 7) === dateFilter; });
            } else {
                clearBtn.style.display = 'none';
                listTitle.innerText = '所有记录';
            }

            filtered.sort((a, b) => {
                const dateA = new Date(a.time).setHours(0,0,0,0);
                const dateB = new Date(b.time).setHours(0,0,0,0);
                if (dateB !== dateA) return dateB - dateA;
                return (a.order || 0) - (b.order || 0);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">🍃<br><br>没有找到相关记录哦，快去记一笔吧！</div>`;
                return;
            }

            container.innerHTML = '';
            sortableInstances.forEach(inst => inst.destroy());
            sortableInstances = [];

            const groups = {};
            filtered.forEach(item => {
                const datePart = item.time.substring(0, 10);
                if (!groups[datePart]) groups[datePart] = [];
                groups[datePart].push(item);
            });

            for (const datePart in groups) {
                const [year, month, day] = datePart.split('-');
                const groupDiv = document.createElement('div');
                groupDiv.className = 'month-group';
                groupDiv.innerHTML = `
                    <div class="month-header">
                        <span>${year}年${parseInt(month)}月${parseInt(day)}日</span>
                        <span class="month-count">${groups[datePart].length} 项记录</span>
                    </div>
                    <div class="sortable-list" data-date="${datePart}"></div>
                `;
                
                const listContainer = groupDiv.querySelector('.sortable-list');
                groups[datePart].forEach(item => {
                    const cat = categories.find(c => c.id === item.categoryId) || { name: '未知', emoji: '📝', color: '#F2F2F7' };
                    let timeStr = `${month}/${day}`;
                    if(item.endTime) {
                        const ed = new Date(item.endTime);
                        timeStr += ` - ${String(ed.getMonth()+1).padStart(2,'0')}/${String(ed.getDate()).padStart(2,'0')}`;
                    }
                    
                    const hlClass = (item.id === highlightedRecordId) ? 'highlight-record' : '';
                    const card = document.createElement('div');
                    card.className = `record-card ${hlClass}`;
                    card.setAttribute('data-id', item.id);
                    const detailHtml = item.detail ? `<div class="record-detail">${item.detail.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>` : '';
                    card.innerHTML = `
                        <div class="record-icon" style="background-color: ${cat.color}">${cat.emoji}</div>
                        <div class="record-content">
                            <div class="record-top">
                                <div class="record-title">${cat.name}</div>
                                <div class="record-time">${timeStr}</div>
                            </div>
                            ${detailHtml}
                            <div class="record-actions">
                                <button class="action-btn" onclick="openRecordModal('${item.id}')">编辑</button>
                                <button class="action-btn" onclick="deleteRecord('${item.id}')" style="color:#FF5C5C">删除</button>
                            </div>
                        </div>
                        <div class="drag-handle" title="长按拖拽修改顺序">☰</div>
                    `;
                    listContainer.appendChild(card);
                });
                container.appendChild(groupDiv);

                const sortable = new Sortable(listContainer, {
                    animation: 150,
                    handle: '.record-card',
                    delay: 200, 
                    delayOnTouchOnly: true, 
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        const listEl = evt.to;
                        const cardElements = listEl.querySelectorAll('.record-card');
                        const newOrderIds = Array.from(cardElements).map(el => el.getAttribute('data-id'));
                        newOrderIds.forEach((id, index) => {
                            const recordIndex = records.findIndex(r => r.id === id);
                            if(recordIndex !== -1) records[recordIndex].order = index;
                        });
                        saveRecords();
                    },
                });
                sortableInstances.push(sortable);
            }
        }

        function toggleEndDate() {
            const isSingleDay = document.getElementById('isSingleDay').checked;
            const endTimeInput = document.getElementById('recordEndTime');
            const endSeparator = document.getElementById('endDateSeparator');
            if(isSingleDay) {
                endTimeInput.style.display = 'none';
                endSeparator.style.display = 'none';
                endTimeInput.value = '';
            } else {
                endTimeInput.style.display = 'block';
                endSeparator.style.display = 'inline-block';
            }
        }

        function openRecordModal(editId = null) {
            const modal = document.getElementById('recordModal');
            const grid = document.getElementById('recordCategoryGrid');
            grid.innerHTML = categories.map(cat => `
                <div class="category-item" id="cat-select-${cat.id}" data-id="${cat.id}" style="background-color: ${cat.color}33;" onclick="selectRecordCategory('${cat.id}')">
                    <span>${cat.emoji}</span><span>${cat.name}</span>
                </div>
            `).join('');

            if (editId) {
                const item = records.find(r => r.id === editId);
                if (item) {
                    document.getElementById('recordModalTitle').innerText = '修改记录';
                    document.getElementById('recordId').value = item.id;
                    document.getElementById('recordTime').value = item.time.substring(0, 10);
                    if(item.endTime) {
                        document.getElementById('recordEndTime').value = item.endTime;
                        document.getElementById('isSingleDay').checked = false;
                    } else {
                        document.getElementById('recordEndTime').value = '';
                        document.getElementById('isSingleDay').checked = true;
                    }
                    document.getElementById('recordDetail').value = item.detail || '';
                    selectRecordCategory(item.categoryId);
                }
            } else {
                document.getElementById('recordModalTitle').innerText = '新增记录';
                document.getElementById('recordForm').reset();
                document.getElementById('recordId').value = '';
                document.getElementById('recordEndTime').value = '';
                document.getElementById('isSingleDay').checked = true;
                document.getElementById('recordTime').value = getTodayString();
                if(categories.length > 0) selectRecordCategory(categories[0].id);
            }
            modal.classList.add('active');
        }

        function selectRecordCategory(id) {
            selectedRecordCategory = id;
            document.querySelectorAll('#recordCategoryGrid .category-item').forEach(el => {
                if (el.getAttribute('data-id') === id) {
                    el.style.borderColor = 'var(--text-main)';
                    el.style.backgroundColor = 'var(--card-bg)';
                } else {
                    el.style.borderColor = 'transparent';
                    const cat = categories.find(c => c.id === el.getAttribute('data-id'));
                    if(cat) el.style.backgroundColor = cat.color;
                }
            });
            
            const cat = categories.find(c => c.id === id);
            const singleDayToggle = document.getElementById('singleDayToggle');
            const endTimeInput = document.getElementById('recordEndTime');
            const endSeparator = document.getElementById('endDateSeparator');
            const isSingleDay = document.getElementById('isSingleDay');
            
            if(cat && (cat.name.includes('病') || cat.name.includes('医院'))) {
                singleDayToggle.style.display = 'flex';
                if (isSingleDay.checked) {
                    endTimeInput.style.display = 'none';
                    endSeparator.style.display = 'none';
                } else {
                    endTimeInput.style.display = 'block';
                    endSeparator.style.display = 'inline-block';
                }
            } else {
                singleDayToggle.style.display = 'none';
                endTimeInput.style.display = 'none';
                endSeparator.style.display = 'none';
                endTimeInput.value = '';
            }
        }

        function handleRecordSubmit(e) {
            e.preventDefault();
            if (!selectedRecordCategory) return alert('请选择一个类别');
            const id = document.getElementById('recordId').value;
            const time = document.getElementById('recordTime').value; 
            const endTime = document.getElementById('recordEndTime').value;
            const detail = document.getElementById('recordDetail').value.trim();
            const isSingleDay = document.getElementById('isSingleDay').checked;
            
            const cat = categories.find(c => c.id === selectedRecordCategory);
            if (cat && (cat.name.includes('病') || cat.name.includes('医院')) && !isSingleDay && !endTime) {
                return alert('请选择结束日期，或勾选“仅一天”');
            }
            
            let targetId = id;
            if (id) {
                const index = records.findIndex(r => r.id === id);
                if (index !== -1) {
                    records[index].categoryId = selectedRecordCategory;
                    records[index].time = time;
                    records[index].endTime = endTime || null;
                    records[index].detail = detail;
                }
            } else {
                const maxOrder = records.reduce((max, r) => (r.order > max ? r.order : max), 0);
                targetId = Date.now().toString();
                records.push({ 
                    id: targetId, 
                    categoryId: selectedRecordCategory, 
                    time, 
                    endTime: endTime || null,
                    detail,
                    order: maxOrder + 1 
                });
            }
            saveRecords();
            highlightedRecordId = targetId; 
            renderRecords();
            closeModal('recordModal');
            
            setTimeout(() => { highlightedRecordId = null; }, 2000);
        }

        function deleteRecord(id) {
            if (confirm('确定删除这条记录？')) {
                records = records.filter(r => r.id !== id);
                saveRecords();
                renderRecords();
            }
        }

        // --- 分类标签管理 ---
        function openTagManager() {
            document.getElementById('tagManagerModal').classList.add('active');
            renderTagManagerList();
        }

        function renderTagManagerList() {
            const list = document.getElementById('tagManageList');
            list.innerHTML = categories.map((cat, index) => `
                <div class="tag-manage-item">
                    <div class="tag-manage-info">
                        <div class="tag-manage-icon" style="background-color: ${cat.color}">${cat.emoji}</div>
                        <span>${cat.name}</span>
                    </div>
                    <div class="tag-manage-actions">
                        <button class="icon-btn" onclick="moveTag(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>⬆️</button>
                        <button class="icon-btn" onclick="moveTag(${index}, 1)" ${index === categories.length - 1 ? 'disabled style="opacity:0.3"' : ''}>⬇️</button>
                        <button class="icon-btn" onclick="openTagEditModal('${cat.id}')">✏️</button>
                        <button class="icon-btn" onclick="deleteTag('${cat.id}')" style="color:#FF5C5C">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function moveTag(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= categories.length) return;
            const temp = categories[index];
            categories[index] = categories[newIndex];
            categories[newIndex] = temp;
            saveCategories();
            renderTagManagerList();
        }

        function deleteTag(id) {
            if(categories.length <= 1) return alert("至少保留一个分类哦！");
            if(records.some(r => r.categoryId === id)) {
                if(!confirm('有记录正在使用此分类，删除后这些记录的分类会显示为空。确认删除？')) return;
            } else {
                if(!confirm('确定删除此分类？')) return;
            }
            categories = categories.filter(c => c.id !== id);
            if(currentFilter === id) currentFilter = 'all';
            saveCategories();
            renderTagManagerList();
        }

        function initColorPicker() {
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.addEventListener('click', function() {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedTagColor = this.getAttribute('data-color');
                });
            });
        }

        function openTagEditModal(id = null) {
            const modal = document.getElementById('tagEditModal');
            if (id) {
                const cat = categories.find(c => c.id === id);
                document.getElementById('tagEditTitle').innerText = '修改分类';
                document.getElementById('tagEditId').value = cat.id;
                document.getElementById('tagName').value = cat.name;
                document.getElementById('tagEmoji').value = cat.emoji;
                setPickerColor(cat.color);
            } else {
                document.getElementById('tagEditTitle').innerText = '添加新分类';
                document.getElementById('tagForm').reset();
                document.getElementById('tagEditId').value = '';
                setPickerColor('#FFE8E8');
            }
            modal.classList.add('active');
        }

        function setPickerColor(color) {
            selectedTagColor = color;
            document.querySelectorAll('.color-swatch').forEach(s => {
                if(s.getAttribute('data-color') === color) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        }

        function handleTagSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('tagEditId').value;
            const name = document.getElementById('tagName').value.trim();
            const emoji = document.getElementById('tagEmoji').value.trim();
            
            if (id) {
                const index = categories.findIndex(c => c.id === id);
                if (index !== -1) categories[index] = { id, name, emoji, color: selectedTagColor };
            } else {
                categories.push({ id: 'cat_' + Date.now(), name, emoji, color: selectedTagColor });
            }
            saveCategories();
            renderTagManagerList();
            closeModal('tagEditModal');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function exportData() {
            const data = {
                name: localStorage.getItem('dog_name'),
                slogan: localStorage.getItem('dog_slogan'),
                avatar: localStorage.getItem('dog_avatar'),
                categories: categories,
                records: records,
                bodyStats: bodyStats
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `狗狗日记备份_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.records && Array.isArray(imported.categories)) {
                        if(imported.name) localStorage.setItem('dog_name', imported.name);
                        if(imported.slogan) localStorage.setItem('dog_slogan', imported.slogan);
                        if(imported.avatar) localStorage.setItem('dog_avatar', imported.avatar);
                        categories = imported.categories;
                        records = imported.records;
                        bodyStats = imported.bodyStats || [];
                        saveCategories(false);
                        saveRecords(false);
                        saveBodyStats(false);
                        loadSettings();
                        renderApp();
                        alert('数据导入成功！');
                        debounceSyncToCloud();
                    } else alert('数据格式不正确');
                } catch (err) { alert('读取失败，请确认文件'); }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
