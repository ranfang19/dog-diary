<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记录狗狗的每一天</title>
    <!-- 引入 SortableJS 库以支持拖拽 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2C;
            --text-muted: #8E8E93;
            --accent-yellow: #FFD479;
            --tag-bg: #F4F3EF;
            
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-pill: 100px;
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 头部放大 */
        .header { padding: 36px 24px 16px; }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .user-profile { display: flex; align-items: center; gap: 16px; }
        
        .avatar-container { position: relative; cursor: pointer; flex-shrink: 0; }
        .avatar {
            width: 72px; height: 72px;
            background: #EFEFEF; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; overflow: hidden; object-fit: cover;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-hint {
            position: absolute; bottom: -2px; right: -2px;
            background: var(--text-main); color: #fff;
            border-radius: 50%; width: 22px; height: 22px;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-color);
        }

        .greeting-text { display: flex; flex-direction: column; }
        .greeting { font-size: 16px; font-weight: 400; color: var(--text-muted); margin-bottom: 2px; }
        
        .name-wrapper {
            display: flex; align-items: center; 
        }
        .pet-name-input {
            background: transparent; border: none; color: var(--text-main);
            font-size: 22px; font-weight: 700; outline: none; width: 140px;
            border-bottom: 1px dashed transparent; transition: border-color 0.2s;
        }
        .pet-name-input:focus, .pet-name-input:hover {
            border-bottom-color: var(--text-muted);
        }

        /* 身体数据栏 */
        .body-stats-wrapper {
            display: flex; gap: 12px; font-size: 14px; color: var(--text-muted);
            margin-top: 4px; cursor: pointer; border-bottom: 1px dashed transparent;
            transition: border-color 0.2s; padding-bottom: 2px; width: fit-content;
        }
        .body-stats-wrapper:hover {
            border-bottom-color: var(--text-muted);
        }
        .body-stats-wrapper b { color: var(--text-main); font-weight: 600; }

        .slogan-input {
            width: 100%; background: transparent; border: none;
            font-size: 28px; font-weight: 700; color: var(--text-main);
            margin-bottom: 16px; outline: none;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px dashed transparent; transition: border-color 0.2s;
        }
        .slogan-input:focus, .slogan-input:hover {
            border-bottom-color: var(--text-muted);
        }

        /* 筛选区 */
        .filter-section {
            padding: 0 24px 16px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
        }
        .filter-section::-webkit-scrollbar { display: none; }
        .filter-tag {
            padding: 8px 16px; background: var(--tag-bg); border-radius: var(--radius-pill);
            font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s; border: none; display: flex; align-items: center; justify-content: center;
        }
        .filter-tag.active { background: var(--accent-yellow); color: var(--text-main); font-weight: 600; }
        
        /* 列表顶部区域 (包含日期筛选) */
        .list-header-bar {
            padding: 10px 24px 0; display: flex; align-items: center; justify-content: space-between;
        }
        .list-header-title {
            font-size: 18px; font-weight: 700; color: var(--text-main);
        }
        
        /* 定制日历筛选器 */
        .date-filter-wrapper {
            position: relative; display: flex; align-items: center; background: var(--tag-bg); 
            border-radius: 12px; padding: 6px 12px; overflow: hidden;
        }
        .date-filter-icon {
            font-size: 18px; pointer-events: none;
        }
        .date-filter-input {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%; 
            opacity: 0; cursor: pointer; z-index: 1;
        }
        .date-clear-btn {
            background: none; border: none; color: var(--text-muted); 
            font-size: 14px; cursor: pointer; display: none; 
            padding-left: 8px; border-left: 1px solid #D1D1D6; margin-left: 8px; 
            position: relative; z-index: 2; font-weight: bold;
        }

        /* 列表 */
        .container { padding: 4px 24px 10px; }
        .month-group { margin-bottom: 20px; }
        .month-header {
            font-size: 15px; font-weight: 600; color: var(--text-muted);
            margin: 16px 0 12px; display: flex; align-items: center; justify-content: space-between;
        }
        .month-count { font-size: 12px; font-weight: normal; }

        .record-card {
            background: var(--card-bg); border-radius: var(--radius-xl); padding: 16px 20px;
            margin-bottom: 16px; box-shadow: var(--shadow-soft); display: flex; gap: 16px; align-items: flex-start;
            transition: transform 0.2s; /* 拖拽时的动画 */
            position: relative;
        }
        /* 拖拽状态的样式 */
        .sortable-ghost {
            opacity: 0.4;
        }
        .sortable-drag {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .record-icon {
            width: 48px; height: 48px; border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
        }
        .record-content { flex: 1; }
        .record-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .record-title { font-weight: 600; font-size: 16px; color: var(--text-main); }
        .record-time { font-size: 13px; color: var(--text-muted); font-weight: 500;}
        .record-detail { font-size: 14px; color: var(--text-muted); line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
        .record-actions { margin-top: 10px; display: flex; gap: 16px; justify-content: flex-end; }
        .action-btn { background: none; border: none; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; }
        
        /* 拖拽手柄指示器 */
        .drag-handle {
            display: none; /* 默认隐藏，或者可以显示一个细微的图标 */
            position: absolute; right: 16px; top: 16px;
            color: #C7C7CC; cursor: grab; font-size: 16px;
        }
        .record-card:hover .drag-handle { display: block; }

        /* FAB悬浮按钮 */
        .fab-container {
            position: fixed; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center; pointer-events: none; z-index: 99;
        }
        .fab {
            width: 60px; height: 60px; background: var(--text-main); color: #FFF;
            border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); cursor: pointer; pointer-events: auto;
        }

        /* Modal通用 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            display: none; align-items: flex-end; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: var(--bg-color); width: 100%; max-width: 600px;
            border-radius: 24px 24px 0 0; padding: 24px 24px 40px;
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: var(--tag-bg); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--text-muted); cursor: pointer; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 10px; }
        .form-input, .form-textarea {
            width: 100%; padding: 14px; background: var(--card-bg); color: var(--text-main);
            border: none; border-radius: 12px; font-size: 15px; outline: none;
        }
        .form-textarea { height: 90px; resize: none; }
        .btn-submit {
            width: 100%; background: var(--text-main); color: #FFF; padding: 16px;
            border: none; border-radius: var(--radius-pill); font-size: 16px; font-weight: 600; cursor: pointer;
        }

        /* 分类选择网格 */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .category-item {
            background: var(--card-bg); padding: 12px; border-radius: var(--radius-lg); text-align: center;
            font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 6px; border: 2px solid transparent;
        }
        .category-item.selected { border-color: var(--accent-yellow); color: var(--text-main); }
        .category-item span:first-child { font-size: 24px; }

        /* 标签管理列表 */
        .tag-manage-list { display: flex; flex-direction: column; gap: 10px; }
        .tag-manage-item {
            display: flex; align-items: center; justify-content: space-between; background: var(--card-bg);
            padding: 12px 16px; border-radius: 12px;
        }
        .tag-manage-info { display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .tag-manage-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;}
        .tag-manage-actions { display: flex; gap: 8px; }
        .icon-btn { background: var(--tag-bg); border: none; width: 30px; height: 30px; border-radius: 8px; color: var(--text-main); cursor: pointer; }

        /* 颜色选择器 */
        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
        .color-swatch {
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .color-swatch.selected { border-color: var(--text-main); transform: scale(1.1); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .data-tools { text-align: center; margin-top: 30px; font-size: 12px; color: #C7C7CC; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="user-profile">
                <!-- 头像上传 -->
                <label class="avatar-container" title="点击修改头像">
                    <div class="avatar" id="avatarPreview">🐶</div>
                    <div class="avatar-hint">📷</div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
                </label>
                <div class="greeting-text">
                    <span class="greeting" id="greetingMsg">Good morning ☀️</span>
                    <!-- 狗狗名字修改 -->
                    <div class="name-wrapper">
                        <input type="text" id="petName" class="pet-name-input" value="Emma" onblur="saveSettings()" placeholder="输入名字" title="点击修改名字">
                    </div>
                    <!-- 身体数据修改 -->
                    <div class="body-stats-wrapper" onclick="openStatsModal()" title="点击修改身体数据">
                        <span>体重: <b id="displayWeight">--</b> kg</span>
                        <span>颈围: <b id="displayNeck">--</b> cm</span>
                        <span>胸围: <b id="displayChest">--</b> cm</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- 标语修改 -->
        <input type="text" id="slogan" class="slogan-input" value="记录狗狗的每一天" maxlength="15" onblur="saveSettings()" placeholder="一句话记录" title="点击修改标语">
    </div>

    <!-- 动态分类标签 -->
    <div class="filter-section" id="filterTagsContainer">
        <!-- JS 渲染 -->
    </div>

    <!-- 列表顶部栏：所有记录 + 时间筛选 (按月) -->
    <div class="list-header-bar" id="listHeaderBar">
        <div class="list-header-title" id="listTitle">所有记录</div>
        <div class="date-filter-wrapper" id="dateFilterWrapper" title="筛选月份">
            <span class="date-filter-icon">📅</span>
            <input type="month" id="dateFilter" class="date-filter-input" onchange="renderRecords()">
            <button class="date-clear-btn" id="clearDateBtn" onclick="clearDateFilter()" title="清除日期">✕</button>
        </div>
    </div>

    <div class="container" id="recordsContainer"></div>

    <div class="fab-container">
        <button class="fab" onclick="openRecordModal()">+</button>
    </div>

    <!-- 记录添加/编辑弹窗 -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="recordModalTitle">新增记录</div>
                <button class="modal-close" onclick="closeModal('recordModal')">✕</button>
            </div>
            <form id="recordForm" onsubmit="handleRecordSubmit(event)">
                <input type="hidden" id="recordId">
                <div class="form-group">
                    <label class="form-label">类别</label>
                    <div class="category-grid" id="recordCategoryGrid"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">日期</label>
                    <input type="date" id="recordTime" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">详情</label>
                    <textarea id="recordDetail" class="form-textarea" placeholder="写下今天发生的事情..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">保存记录</button>
            </form>
        </div>
    </div>

    <!-- 身体数据管理弹窗 -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">身体数据记录</div>
                <button class="modal-close" onclick="closeModal('statsModal')">✕</button>
            </div>
            <form id="statsForm" onsubmit="handleStatsSubmit(event)">
                <input type="hidden" id="statId">
                <div class="category-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">体重(kg)</label>
                        <input type="number" step="0.1" id="statInputWeight" class="form-input" required>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">颈围(cm)</label>
                        <input type="number" step="0.1" id="statInputNeck" class="form-input" required>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">胸围(cm)</label>
                        <input type="number" step="0.1" id="statInputChest" class="form-input" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label class="form-label">测量日期</label>
                    <input type="date" id="statInputDate" class="form-input" required>
                </div>
                <button type="submit" class="btn-submit">保存数据</button>
            </form>
            
            <div style="margin-top: 32px;">
                <div class="form-label" style="font-weight: 600; color: var(--text-main);">历史数据记录</div>
                <div class="tag-manage-list" id="statsHistoryList"></div>
            </div>
        </div>
    </div>

    <!-- 标签管理弹窗 -->
    <div class="modal-overlay" id="tagManagerModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">管理分类标签</div>
                <button class="modal-close" onclick="closeModal('tagManagerModal'); renderApp();">✕</button>
            </div>
            <div class="tag-manage-list" id="tagManageList"></div>
            <button class="btn-submit" style="margin-top:20px; background:var(--tag-bg); color:var(--text-main);" onclick="openTagEditModal()">+ 添加新分类</button>
        </div>
    </div>

    <!-- 单个标签编辑弹窗 -->
    <div class="modal-overlay" id="tagEditModal" style="z-index: 1100;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="tagEditTitle">添加分类</div>
                <button class="modal-close" onclick="closeModal('tagEditModal')">✕</button>
            </div>
            <form id="tagForm" onsubmit="handleTagSubmit(event)">
                <input type="hidden" id="tagEditId">
                <div class="form-group">
                    <label class="form-label">名称 (如: 洗澡)</label>
                    <input type="text" id="tagName" class="form-input" required maxlength="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Emoji 图标</label>
                    <input type="text" id="tagEmoji" class="form-input" required maxlength="2" placeholder="🐶">
                </div>
                <div class="form-group">
                    <label class="form-label">背景颜色</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-swatch" style="background:#FFE8E8" data-color="#FFE8E8"></div>
                        <div class="color-swatch" style="background:#E8F4FF" data-color="#E8F4FF"></div>
                        <div class="color-swatch" style="background:#EAF6E3" data-color="#EAF6E3"></div>
                        <div class="color-swatch" style="background:#FFF4D4" data-color="#FFF4D4"></div>
                        <div class="color-swatch" style="background:#F3E8FF" data-color="#F3E8FF"></div>
                        <div class="color-swatch" style="background:#F2F2F7" data-color="#F2F2F7"></div>
                        <div class="color-swatch" style="background:#FFE0B2" data-color="#FFE0B2"></div>
                        <div class="color-swatch" style="background:#D1C4E9" data-color="#D1C4E9"></div>
                    </div>
                </div>
                <button type="submit" class="btn-submit">保存标签</button>
            </form>
        </div>
    </div>

    <div class="data-tools">
        <span onclick="exportData()" style="cursor:pointer">导出数据</span> | 
        <span onclick="document.getElementById('importFileInput').click()" style="cursor:pointer">恢复数据</span>
        <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="handleFileImport(event)">
    </div>

    <script>
        const DEFAULT_CATEGORIES = [
            { id: 'c1', name: '饮食', emoji: '🍖', color: '#F3E8FF' },
            { id: 'c2', name: '出去玩', emoji: '🎾', color: '#FFF4D4' },
            { id: 'c3', name: '驱虫', emoji: '💊', color: '#EAF6E3' },
            { id: 'c4', name: '洗澡', emoji: '🛁', color: '#E8F4FF' },
            { id: 'c5', name: '生病', emoji: '🏥', color: '#FFE8E8' }
        ];

        let records = [];
        let categories = [];
        let bodyStats = [];
        let currentFilter = 'all';
        let selectedRecordCategory = '';
        let selectedTagColor = '#FFE8E8';
        let sortableInstances = []; // 存储所有Sortable实例，方便销毁重建

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 初始化
        window.onload = function() {
            setGreeting();
            loadSettings();
            
            // 确保旧数据包含 order 字段
            records.forEach((r, index) => {
                if (r.order === undefined) {
                    r.order = index; 
                }
            });
            saveRecords();
            
            document.getElementById('dateFilter').value = '';
            
            renderApp();
            initColorPicker();
        };

        function setGreeting() {
            const hour = new Date().getHours();
            document.getElementById('greetingMsg').innerText = hour < 12 ? 'Good morning ☀️' : (hour < 18 ? 'Good afternoon ☕' : 'Good evening 🌙');
        }

        // --- 数据加载与保存 ---
        function loadSettings() {
            const savedName = localStorage.getItem('dog_name');
            if (savedName) document.getElementById('petName').value = savedName;
            
            const savedSlogan = localStorage.getItem('dog_slogan');
            if (savedSlogan) {
                document.getElementById('slogan').value = savedSlogan;
            }
            
            document.title = document.getElementById('slogan').value.trim() || '狗狗日常记录';

            const savedAvatar = localStorage.getItem('dog_avatar');
            if (savedAvatar) {
                document.getElementById('avatarPreview').innerHTML = `<img src="${savedAvatar}" alt="avatar">`;
            }

            const savedCategories = localStorage.getItem('dog_categories');
            categories = savedCategories ? JSON.parse(savedCategories) : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));

            const savedRecords = localStorage.getItem('dog_records');
            records = savedRecords ? JSON.parse(savedRecords) : [];
            
            const savedBodyStats = localStorage.getItem('dog_body_stats');
            bodyStats = savedBodyStats ? JSON.parse(savedBodyStats) : [];
            
            renderLatestBodyStats();
        }

        function saveSettings() {
            const petName = document.getElementById('petName').value.trim();
            const slogan = document.getElementById('slogan').value.trim();
            
            localStorage.setItem('dog_name', petName);
            localStorage.setItem('dog_slogan', slogan);
            
            document.title = slogan || '狗狗日常记录';
        }

        function saveCategories() {
            localStorage.setItem('dog_categories', JSON.stringify(categories));
        }

        function saveRecords() {
            localStorage.setItem('dog_records', JSON.stringify(records));
        }
        
        function saveBodyStats() {
            localStorage.setItem('dog_body_stats', JSON.stringify(bodyStats));
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Img = e.target.result;
                    document.getElementById('avatarPreview').innerHTML = `<img src="${base64Img}" alt="avatar">`;
                    localStorage.setItem('dog_avatar', base64Img);
                };
                reader.readAsDataURL(file);
            }
        }

        // --- 身体数据管理逻辑 ---
        function renderLatestBodyStats() {
            if (bodyStats.length === 0) {
                document.getElementById('displayWeight').innerText = '--';
                document.getElementById('displayNeck').innerText = '--';
                document.getElementById('displayChest').innerText = '--';
                return;
            }
            const latest = [...bodyStats].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
            document.getElementById('displayWeight').innerText = latest.weight;
            document.getElementById('displayNeck').innerText = latest.neck;
            document.getElementById('displayChest').innerText = latest.chest;
        }

        function openStatsModal(editId = null) {
            const modal = document.getElementById('statsModal');
            if (editId) {
                const stat = bodyStats.find(s => s.id === editId);
                if (stat) {
                    document.getElementById('statId').value = stat.id;
                    document.getElementById('statInputWeight').value = stat.weight;
                    document.getElementById('statInputNeck').value = stat.neck;
                    document.getElementById('statInputChest').value = stat.chest;
                    document.getElementById('statInputDate').value = stat.date;
                }
            } else {
                document.getElementById('statsForm').reset();
                document.getElementById('statId').value = '';
                document.getElementById('statInputDate').value = getTodayString();
                
                if (bodyStats.length > 0) {
                    const latest = [...bodyStats].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
                    document.getElementById('statInputWeight').value = latest.weight;
                    document.getElementById('statInputNeck').value = latest.neck;
                    document.getElementById('statInputChest').value = latest.chest;
                }
            }
            renderStatsHistoryList();
            modal.classList.add('active');
        }

        function handleStatsSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('statId').value;
            const weight = document.getElementById('statInputWeight').value;
            const neck = document.getElementById('statInputNeck').value;
            const chest = document.getElementById('statInputChest').value;
            const date = document.getElementById('statInputDate').value;
            
            if (id) {
                const index = bodyStats.findIndex(s => s.id === id);
                if (index !== -1) bodyStats[index] = { id, weight, neck, chest, date };
            } else {
                bodyStats.push({ id: 'stat_' + Date.now(), weight, neck, chest, date });
            }
            
            saveBodyStats();
            renderLatestBodyStats();
            document.getElementById('statsForm').reset();
            document.getElementById('statId').value = '';
            document.getElementById('statInputDate').value = getTodayString();
            renderStatsHistoryList();
        }

        function renderStatsHistoryList() {
            const list = document.getElementById('statsHistoryList');
            if (bodyStats.length === 0) {
                list.innerHTML = '<div style="text-align:center; font-size:13px; color:var(--text-muted); padding:10px;">暂无历史记录</div>';
                return;
            }
            
            const sortedStats = [...bodyStats].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            list.innerHTML = sortedStats.map(stat => `
                <div class="tag-manage-item" style="flex-direction:column; align-items:flex-start; gap:8px;">
                    <div style="display:flex; justify-content:space-between; width:100%; border-bottom:1px solid #F4F3EF; padding-bottom:6px;">
                        <span style="font-weight:600; font-size:14px; color:var(--text-main);">📅 ${stat.date}</span>
                        <div class="tag-manage-actions">
                            <button type="button" class="icon-btn" onclick="openStatsModal('${stat.id}')">✏️</button>
                            <button type="button" class="icon-btn" onclick="deleteStat('${stat.id}')" style="color:#FF5C5C">🗑️</button>
                        </div>
                    </div>
                    <div style="display:flex; gap:16px; font-size:13px; color:var(--text-muted);">
                        <span>⚖️ 体重: <b style="color:var(--text-main)">${stat.weight}</b>kg</span>
                        <span>🧣 颈围: <b style="color:var(--text-main)">${stat.neck}</b>cm</span>
                        <span>🎽 胸围: <b style="color:var(--text-main)">${stat.chest}</b>cm</span>
                    </div>
                </div>
            `).join('');
        }

        function deleteStat(id) {
            if (confirm('确定删除这条身体数据记录？')) {
                bodyStats = bodyStats.filter(s => s.id !== id);
                saveBodyStats();
                renderLatestBodyStats();
                renderStatsHistoryList();
            }
        }

        // --- 核心渲染逻辑 ---
        function renderApp() {
            renderFilterTags();
            renderRecords();
        }

        function renderFilterTags() {
            const container = document.getElementById('filterTagsContainer');
            let html = `<button class="filter-tag ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</button>`;
            
            categories.forEach(cat => {
                html += `<button class="filter-tag ${currentFilter === cat.id ? 'active' : ''}" onclick="setFilter('${cat.id}')">${cat.name}</button>`;
            });
            
            html += `<button class="filter-tag" style="font-weight:bold; padding: 8px 12px;" onclick="openTagManager()">➕</button>`;
            
            container.innerHTML = html;
        }

        function setFilter(catId) {
            currentFilter = catId;
            renderFilterTags();
            renderRecords();
        }
        
        function clearDateFilter() {
            document.getElementById('dateFilter').value = '';
            renderRecords();
        }

        function renderRecords() {
            const container = document.getElementById('recordsContainer');
            const dateFilter = document.getElementById('dateFilter').value; 
            const clearBtn = document.getElementById('clearDateBtn');
            const listTitle = document.getElementById('listTitle');
            
            let filtered = records;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(r => r.categoryId === currentFilter);
            }
            
            if (dateFilter) {
                clearBtn.style.display = 'block';
                const parts = dateFilter.split('-');
                listTitle.innerText = `${parts[0]}年${parseInt(parts[1])}月`;
                
                filtered = filtered.filter(r => {
                    const recordMonth = r.time.substring(0, 7); 
                    return recordMonth === dateFilter;
                });
            } else {
                clearBtn.style.display = 'none';
                listTitle.innerText = '所有记录';
            }

            // 先按日期降序，如果同一天，则按照 order 字段升序排列，以保持用户拖拽的顺序
            filtered.sort((a, b) => {
                const dateA = new Date(a.time).setHours(0,0,0,0);
                const dateB = new Date(b.time).setHours(0,0,0,0);
                if (dateB !== dateA) {
                    return dateB - dateA;
                }
                // 日期相同，按order升序
                return (a.order || 0) - (b.order || 0);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">🍃<br><br>没有找到相关记录哦，快去记一笔吧！</div>`;
                return;
            }

            container.innerHTML = '';
            
            // 销毁旧的 Sortable 实例
            sortableInstances.forEach(inst => inst.destroy());
            sortableInstances = [];

            const groups = {};
            // 在此修改分组逻辑：按照“具体到天”进行分组，以便在同一天内进行拖拽
            filtered.forEach(item => {
                const datePart = item.time.substring(0, 10);
                if (!groups[datePart]) groups[datePart] = [];
                groups[datePart].push(item);
            });

            for (const datePart in groups) {
                const [year, month, day] = datePart.split('-');
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'month-group';
                
                // 表头显示具体的日期
                groupDiv.innerHTML = `
                    <div class="month-header">
                        <span>${year}年${parseInt(month)}月${parseInt(day)}日</span>
                        <span class="month-count">${groups[datePart].length} 项记录</span>
                    </div>
                    <div class="sortable-list" data-date="${datePart}"></div>
                `;
                
                const listContainer = groupDiv.querySelector('.sortable-list');

                groups[datePart].forEach(item => {
                    const cat = categories.find(c => c.id === item.categoryId) || { name: '未知', emoji: '📝', color: '#F2F2F7' };
                    
                    const timeStr = `${month}/${day}`;
                    
                    const card = document.createElement('div');
                    card.className = 'record-card';
                    card.setAttribute('data-id', item.id);
                    card.innerHTML = `
                        <div class="record-icon" style="background-color: ${cat.color}">${cat.emoji}</div>
                        <div class="record-content">
                            <div class="record-top">
                                <div class="record-title">${cat.name}</div>
                                <div class="record-time">${timeStr}</div>
                            </div>
                            <div class="record-detail">${item.detail.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>
                            <div class="record-actions">
                                <button class="action-btn" onclick="openRecordModal('${item.id}')">编辑</button>
                                <button class="action-btn" onclick="deleteRecord('${item.id}')" style="color:#FF5C5C">删除</button>
                            </div>
                        </div>
                        <div class="drag-handle" title="长按拖拽修改顺序">☰</div>
                    `;
                    listContainer.appendChild(card);
                });
                container.appendChild(groupDiv);

                // 为同一天的列表初始化 Sortable
                const sortable = new Sortable(listContainer, {
                    animation: 150,
                    handle: '.record-card', // 整个卡片可以拖拽，或者改为 '.drag-handle'
                    delay: 200, // 移动端长按 200ms 后才能拖拽
                    delayOnTouchOnly: true, // 仅在触摸设备上开启延迟，防止误触
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        // 拖拽结束时触发，更新顺序
                        const listEl = evt.to;
                        const dateStr = listEl.getAttribute('data-date');
                        const cardElements = listEl.querySelectorAll('.record-card');
                        
                        // 获取当前天在列表中的新顺序 ID 列表
                        const newOrderIds = Array.from(cardElements).map(el => el.getAttribute('data-id'));
                        
                        // 更新全局 records 中的 order 字段
                        newOrderIds.forEach((id, index) => {
                            const recordIndex = records.findIndex(r => r.id === id);
                            if(recordIndex !== -1) {
                                records[recordIndex].order = index;
                            }
                        });
                        saveRecords();
                    },
                });
                sortableInstances.push(sortable);
            }
        }

        // --- 记录操作 Modal ---
        function openRecordModal(editId = null) {
            const modal = document.getElementById('recordModal');
            const grid = document.getElementById('recordCategoryGrid');
            
            grid.innerHTML = categories.map(cat => `
                <div class="category-item" id="cat-select-${cat.id}" data-id="${cat.id}" style="background-color: ${cat.color}33;" onclick="selectRecordCategory('${cat.id}')">
                    <span>${cat.emoji}</span><span>${cat.name}</span>
                </div>
            `).join('');

            if (editId) {
                const item = records.find(r => r.id === editId);
                if (item) {
                    document.getElementById('recordModalTitle').innerText = '修改记录';
                    document.getElementById('recordId').value = item.id;
                    document.getElementById('recordTime').value = item.time.substring(0, 10);
                    document.getElementById('recordDetail').value = item.detail;
                    selectRecordCategory(item.categoryId);
                }
            } else {
                document.getElementById('recordModalTitle').innerText = '新增记录';
                document.getElementById('recordForm').reset();
                document.getElementById('recordId').value = '';
                
                document.getElementById('recordTime').value = getTodayString();
                if(categories.length > 0) selectRecordCategory(categories[0].id);
            }
            modal.classList.add('active');
        }

        function selectRecordCategory(id) {
            selectedRecordCategory = id;
            document.querySelectorAll('#recordCategoryGrid .category-item').forEach(el => {
                if (el.getAttribute('data-id') === id) {
                    el.style.borderColor = 'var(--text-main)';
                    el.style.backgroundColor = 'var(--card-bg)';
                } else {
                    el.style.borderColor = 'transparent';
                    const cat = categories.find(c => c.id === el.getAttribute('data-id'));
                    if(cat) el.style.backgroundColor = cat.color;
                }
            });
        }

        function handleRecordSubmit(e) {
            e.preventDefault();
            if (!selectedRecordCategory) return alert('请选择一个类别');
            const id = document.getElementById('recordId').value;
            const time = document.getElementById('recordTime').value; 
            const detail = document.getElementById('recordDetail').value.trim();
            
            if (id) {
                const index = records.findIndex(r => r.id === id);
                if (index !== -1) {
                    records[index].categoryId = selectedRecordCategory;
                    records[index].time = time;
                    records[index].detail = detail;
                }
            } else {
                // 新增时赋予最大 order，默认排在当天末尾
                const maxOrder = records.reduce((max, r) => (r.order > max ? r.order : max), 0);
                records.push({ 
                    id: Date.now().toString(), 
                    categoryId: selectedRecordCategory, 
                    time, 
                    detail,
                    order: maxOrder + 1 
                });
            }
            saveRecords();
            renderRecords();
            closeModal('recordModal');
        }

        function deleteRecord(id) {
            if (confirm('确定删除这条记录？')) {
                records = records.filter(r => r.id !== id);
                saveRecords();
                renderRecords();
            }
        }

        // --- 分类标签管理 ---
        function openTagManager() {
            document.getElementById('tagManagerModal').classList.add('active');
            renderTagManagerList();
        }

        function renderTagManagerList() {
            const list = document.getElementById('tagManageList');
            list.innerHTML = categories.map((cat, index) => `
                <div class="tag-manage-item">
                    <div class="tag-manage-info">
                        <div class="tag-manage-icon" style="background-color: ${cat.color}">${cat.emoji}</div>
                        <span>${cat.name}</span>
                    </div>
                    <div class="tag-manage-actions">
                        <button class="icon-btn" onclick="moveTag(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>⬆️</button>
                        <button class="icon-btn" onclick="moveTag(${index}, 1)" ${index === categories.length - 1 ? 'disabled style="opacity:0.3"' : ''}>⬇️</button>
                        <button class="icon-btn" onclick="openTagEditModal('${cat.id}')">✏️</button>
                        <button class="icon-btn" onclick="deleteTag('${cat.id}')" style="color:#FF5C5C">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function moveTag(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= categories.length) return;
            const temp = categories[index];
            categories[index] = categories[newIndex];
            categories[newIndex] = temp;
            saveCategories();
            renderTagManagerList();
        }

        function deleteTag(id) {
            if(categories.length <= 1) return alert("至少保留一个分类哦！");
            if(records.some(r => r.categoryId === id)) {
                if(!confirm('有记录正在使用此分类，删除后这些记录的分类会显示为空。确认删除？')) return;
            } else {
                if(!confirm('确定删除此分类？')) return;
            }
            categories = categories.filter(c => c.id !== id);
            if(currentFilter === id) currentFilter = 'all';
            saveCategories();
            renderTagManagerList();
        }

        function initColorPicker() {
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.addEventListener('click', function() {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedTagColor = this.getAttribute('data-color');
                });
            });
        }

        function openTagEditModal(id = null) {
            const modal = document.getElementById('tagEditModal');
            if (id) {
                const cat = categories.find(c => c.id === id);
                document.getElementById('tagEditTitle').innerText = '修改分类';
                document.getElementById('tagEditId').value = cat.id;
                document.getElementById('tagName').value = cat.name;
                document.getElementById('tagEmoji').value = cat.emoji;
                setPickerColor(cat.color);
            } else {
                document.getElementById('tagEditTitle').innerText = '添加新分类';
                document.getElementById('tagForm').reset();
                document.getElementById('tagEditId').value = '';
                setPickerColor('#FFE8E8');
            }
            modal.classList.add('active');
        }

        function setPickerColor(color) {
            selectedTagColor = color;
            document.querySelectorAll('.color-swatch').forEach(s => {
                if(s.getAttribute('data-color') === color) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        }

        function handleTagSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('tagEditId').value;
            const name = document.getElementById('tagName').value.trim();
            const emoji = document.getElementById('tagEmoji').value.trim();
            
            if (id) {
                const index = categories.findIndex(c => c.id === id);
                if (index !== -1) categories[index] = { id, name, emoji, color: selectedTagColor };
            } else {
                categories.push({ id: 'cat_' + Date.now(), name, emoji, color: selectedTagColor });
            }
            saveCategories();
            renderTagManagerList();
            closeModal('tagEditModal');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function exportData() {
            const data = {
                name: localStorage.getItem('dog_name'),
                slogan: localStorage.getItem('dog_slogan'),
                avatar: localStorage.getItem('dog_avatar'),
                categories: categories,
                records: records,
                bodyStats: bodyStats
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `狗狗日记备份_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.records && Array.isArray(imported.categories)) {
                        if(imported.name) localStorage.setItem('dog_name', imported.name);
                        if(imported.slogan) localStorage.setItem('dog_slogan', imported.slogan);
                        if(imported.avatar) localStorage.setItem('dog_avatar', imported.avatar);
                        categories = imported.categories;
                        records = imported.records;
                        bodyStats = imported.bodyStats || [];
                        saveCategories();
                        saveRecords();
                        saveBodyStats();
                        loadSettings();
                        renderApp();
                        alert('数据导入成功！');
                    } else alert('数据格式不正确');
                } catch (err) { alert('读取失败，请确认文件'); }
            };
            reader.readAsText(file);
        }
    </script>
